server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Backend ki public directory ka correct path
    root /var/www/html/backend/public;

    # index.php ko sabse pehle load karne ke liye
    index index.php index.html index.htm index.nginx-debian.html;

    server_name _;

    # URL Rewriting for Laravel (Taki 404 error na aaye)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP ko process karne ke liye block (Uncommented and fixed)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Note: Agar aapka PHP version 8.1 ya 8.3 hai, toh 8.2 ko us hisaab se change kar lein.
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # Security: hidden files ko block karne ke liye
    location ~ /\.ht {
        deny all;
    }
}
