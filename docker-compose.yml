version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - app-code:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - app-code:/var/www
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://bigbestow.com
      - APP_KEY=base64:5y7haecX82oSq6hDyXQgAIZH9yG1Hs93cz1Kc4EWkkg=
      - DB_CONNECTION=mysql
      - DB_HOST=129.121.125.62
      - DB_PORT=3306
      - DB_DATABASE=bigbestow
      - DB_USERNAME=bigbestow
      - DB_PASSWORD=1Faisal@123
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=https://bigbestow.com
    networks:
      - app-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-ecommerce_faisal}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-Gautam@123#}
    volumes:
      - db-data:/var/lib/mysql

    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app-code:
  db-data:
